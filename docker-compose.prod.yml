version: '3.8'

# ==============================================================================
# AETHERNEXUS OS — ENTERPRISE PRODUCTION DOCKER COMPOSE WITH TRAEFIK & SSL
# ==============================================================================

services:
  traefik:
    image: traefik:v3.0
    container_name: aethernexus-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@aethernexus.ai"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certificates:/letsencrypt"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aethernexus-backend
    restart: always
    environment:
      - PORT=8000
      - AETHERNEXUS_JWT_SECRET=${AETHERNEXUS_JWT_SECRET:-enterprise_master_key_2026}
      - DATABASE_URL=postgresql://aether:nexus_secure_2026@timescaledb:5432/aethernexus_db
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.aethernexus.ai`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      - timescaledb
      - redis
      - mosquitto

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aethernexus-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.aethernexus.ai
      - NEXT_PUBLIC_WS_URL=wss://api.aethernexus.ai/ws/telemetry
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.aethernexus.ai`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aethernexus-timescaledb
    restart: always
    environment:
      - POSTGRES_USER=aether
      - POSTGRES_PASSWORD=nexus_secure_2026
      - POSTGRES_DB=aethernexus_db
    volumes:
      - timescaledb_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aethernexus-redis
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aethernexus-mosquitto
    restart: always
    ports:
      - "1883:1883"

volumes:
  traefik_certificates:
  timescaledb_prod_data:

