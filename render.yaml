# Render Blueprint: AetherNexus OS Enterprise Live Hosting
services:
  # 1. FastAPI 50Hz Telemetry & Intelligence Core
  - type: web
    name: aethernexus-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: AETHERNEXUS_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aethernexus-postgres
          property: connectionString

  # 2. Next.js 15 Apple Pro Light UI Frontend
  - type: web
    name: aethernexus-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: aethernexus-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: aethernexus-backend
          type: web
          property: host

databases:
  # 3. Managed PostgreSQL Database with TimescaleDB
  - name: aethernexus-postgres
    region: oregon
    plan: starter
    databaseName: aethernexus_db
    user: aether
